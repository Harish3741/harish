<meta property="og:type" content="website">
<meta property="og:url" content="https://harishportfolio.site/">

<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="stage">
    <canvas id="game" width="320" height="180"
            aria-label="A pixel-art museum. Use the arrow keys or WASD to walk, and E to look at an exhibit. A plain list of everything here is available from the button in the corner."></canvas>
  </div>

  <button id="skip-to-list" class="skip-btn" type="button">
    <span aria-hidden="true">☰</span> Skip to list
  </button>

  <!-- The phone's museum. A thumb is a bad D-pad, so instead of walking the
       building you stand in the middle of it: the atrium as the game draws it,
       with the four arches off it as the things you tap. -->
  <div id="lobby" class="lobby" hidden>
    <header class="lobby-head">
      <canvas id="lobby-title" class="lobby-title" aria-hidden="true"></canvas>
      <h1 class="sr-only" id="lobby-name"></h1>
      <p class="lobby-tagline"></p>
    </header>

    <div class="lobby-stage">
      <div id="lobby-room" class="lobby-room">
        <canvas id="atrium" class="lobby-canvas"
                aria-label="The museum atrium seen from above: a small droid hovers over the compass in the middle of the marble floor, with a lit archway into each of the four wings."></canvas>
      </div>
    </div>

    <footer class="lobby-foot">
      <p class="lobby-hint">Pick a doorway</p>
      <p class="lobby-note"></p>
      <p class="lobby-credit"></p>
    </footer>
  </div>

  <!-- The lights, for going from one room to the next. -->
  <div id="curtain" class="curtain" hidden aria-hidden="true"></div>

  <!-- The exhibit menu: opens at a plinth. Pixel chrome, real text. -->
  <div id="menu" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="menu-wing">
    <div class="window">
      <div class="window-head">
        <div class="window-head-text">
          <h2 id="menu-wing"></h2>
          <p id="menu-blurb"></p>
        </div>
        <button id="menu-close" class="win-close" type="button" aria-label="Close and go back to the museum">✕</button>
      </div>

      <div class="window-body">
        <div id="menu-list" class="entry-list" role="listbox" tabindex="0" aria-label="Exhibits in this wing"></div>
        <div id="menu-detail" class="entry-detail"></div>
      </div>

      <p class="window-foot">
        <kbd>↑</kbd><kbd>↓</kbd> select
        <span class="sep">·</span> <kbd>Esc</kbd> back
      </p>
    </div>
  </div>

  <!-- The plain version: the escape hatch on desktop, the whole site on mobile. -->
  <div id="listview" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Everything in the museum, as a list">
    <div class="sheet">
      <button id="list-close" class="sheet-close" type="button">← Back to the museum</button>
      <div id="list-body"></div>
    </div>
  </div>

  <!-- The screening room's film. Opens after the camera pans to the screen. -->
  <div id="screening" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="screening-title">
    <div class="reel">
      <div class="reel-head">
        <h2 id="screening-title">Now showing</h2>
        <button id="screening-close" class="win-close" type="button" aria-label="Stop the film and get up">✕</button>
      </div>
      <div id="screening-stage" class="reel-stage"></div>
      <p id="screening-caption" class="reel-caption"></p>
    </div>
  </div>

  <noscript>
    <div class="noscript">
      <h1>Harish</h1>
      <p>This portfolio is a small game, so it needs JavaScript switched on. Sorry about that.</p>
    </div>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
